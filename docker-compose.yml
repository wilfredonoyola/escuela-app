services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      # Solo para desarrollo local. En otros entornos se inyecta desde un gestor de secretos.
      JWT_SECRET: ${JWT_SECRET:-solo-desarrollo-cambiar-este-secreto-0123456789}
      JWT_EXPIRES_IN_SECONDS: 3600
      CORS_ORIGIN: http://localhost:3000
      CACHE_TTL_MS: 60000

  frontend:
    build:
      context: ./frontend
      args:
        # La URL la usa el navegador del usuario, no el contenedor: por eso es localhost.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
